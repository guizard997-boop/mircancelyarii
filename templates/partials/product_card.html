<a href="{{ url_for('product_detail', pid=p.id) }}" class="prod-card">
  <div class="prod-img">
    <img src="{{ p.image_url or 'https://placehold.co/400x400/f5f3ff/7c3aed?text=+' }}" alt="{{ p.name }}" loading="lazy"
         onerror="this.src='https://placehold.co/400x400/f5f3ff/7c3aed?text=+'">
    <span class="prod-heart">♥</span>
  </div>
  <div class="prod-body">
    <div class="prod-name">{{ p.name }}</div>
    <div class="prod-price">
      {% if p.price|float > 0 %}<span class="prod-price-now">{{ '{:,.0f}'.format(p.price).replace(',', ' ') }} сом</span>{% else %}<span class="prod-price-now">Цена уточняется</span>{% endif %}
    </div>
  </div>
</a>
