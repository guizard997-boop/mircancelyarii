{% extends "admin_base.html" %}
{% block title %}Новый долг{% endblock %}
{% block admin %}
<h1 class="section-title mb-2">Долг по товару</h1>
<p class="muted mb-4">Товар из каталога → счёт организации</p>
{% if not orgs %}
<div class="panel"><p class="muted mb-4">Сначала добавьте организацию.</p>
<a href="{{ url_for('admin_org_form') }}" class="btn btn-sm">+ Организация</a></div>
{% else %}
<form method="post" class="panel" style="max-width:420px;display:flex;flex-direction:column;gap:12px">
  <div>
    <label>Организация</label>
    <select name="organization_id" required>
      {% for o in orgs %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label>Товар из магазина</label>
    <select name="product_id">
      <option value="">— выбрать товар —</option>
      {% for p in products %}
      <option value="{{ p.id }}">{{ p.name }} — {{ '{:,.0f}'.format(p.price).replace(',', ' ') }} сом</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label>Количество</label>
    <input type="number" name="quantity" value="1" min="1" max="999">
  </div>
  <p class="muted">Или вручную:</p>
  <input name="manual_name" placeholder="Название вручную">
  <input name="manual_amount" type="number" step="0.01" placeholder="Цена за 1 шт">
  <textarea name="description" rows="2" placeholder="Комментарий"></textarea>
  <button class="btn btn-pink w-full" type="submit">Записать долг</button>
</form>
{% endif %}
{% endblock %}
